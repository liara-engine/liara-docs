name: docs-preview-sweep

on:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight UTC
  workflow_dispatch:
    inputs:
      max-age-days:
        description: Remove previews for open PRs not updated in this many days.
        default: '30'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-24.04

    env:
      ORG: liara-engine
      OUTPUT_BRANCH: cloudflare-pages
      MAX_AGE_DAYS: ${{ github.event.inputs.max-age-days || '30' }}
      GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: cloudflare-pages
          token: ${{ secrets.DOCS_PUSH_TOKEN }}
          path: output-repository
          fetch-depth: '0'

      - uses: actions/checkout@v7
        with:
          repository: '${{ github.repository_owner }}/.github'
          sparse-checkout: |
            scripts
            .github/actions
          path: '.github-shared-core'

      - name: Prune closed / stale previews
        working-directory: output-repository
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          removed=0

          shopt -s nullglob
          for dir in site/*/pr-*; do
            [ -d "$dir" ] || continue
            repo=$(basename "$(dirname "$dir")")
            pr=$(basename "$dir" | sed 's/^pr-//')

            state=$(gh api "repos/${ORG}/${repo}/pulls/${pr}" --jq '.state'      2>/dev/null || echo "missing")
            updated=$(gh api "repos/${ORG}/${repo}/pulls/${pr}" --jq '.updated_at' 2>/dev/null || echo "")

            remove=false
            if [ "$state" != "open" ]; then
              echo "::notice::${repo}#${pr} state=${state} -> remove"
              remove=true
            elif [ -n "$updated" ]; then
              upd=$(date -u -d "$updated" +%s)
              age=$(( (now - upd) / 86400 ))
              if [ "$age" -gt "$MAX_AGE_DAYS" ]; then
                echo "::notice::${repo}#${pr} open but stale (${age}d) -> remove"
                remove=true
              fi
            fi

            if [ "$remove" = true ]; then
              rm -rf "$dir"
              removed=$((removed + 1))
            else
              echo "::notice::${repo}#${pr} open and fresh -> keep"
            fi
          done

          echo "Removed ${removed} preview(s)."

      - uses: ./.github-shared-core/.github/actions/site-refresh
        with:
          site: output-repository/site
          collect-garbage: 'true'
          token: ${{ secrets.ORG_READ_TOKEN }}

      - name: Commit
        run: |
          bash .github-shared-core/scripts/git-publish.sh \
            --repo-dir output-repository \
            --branch "${OUTPUT_BRANCH}" \
            --message "docs: sweep closed/stale previews and collect the asset store" \
            --generated site/registry-index.json \
            --regenerate "$LIARA_INDEX_COMMAND"
